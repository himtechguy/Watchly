<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watchly</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #111;
      font-size: 25px;
      font-weight: bold;
    }

    main {
      padding: 25px;
    }

    .movie {
      max-width: 300px;
      background: #151515;
      border-radius: 10px;
      padding: 20px;
    }

    .poster {
      height: 350px;
      background: linear-gradient(145deg, #333, #111);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      border-radius: 8px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .watch {
      display: inline-block;
      padding: 12px 20px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>WATCHLY</header>

<main>

  <div class="movie">

    <div class="poster">🎬</div>

    <h2>Watchly Movie</h2>

    <p>Free movie available on Watchly.</p>

    <a class="watch" href="player.html">
      ▶ WATCH NOW
    </a>

  </div>

</main>

</body>
</html>

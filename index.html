<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watchly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      position: sticky;
      top: 0;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .search {
      background: #222;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      color: white;
      width: 180px;
    }

    .hero {
      min-height: 420px;
      padding: 80px 25px;
      display: flex;
      align-items: end;
      background: linear-gradient(to top, #080808, transparent),
                  linear-gradient(120deg, #24123d, #111);
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .watch-btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    section {
      padding: 30px 20px;
    }

    section h2 {
      margin-bottom: 20px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }

    .movie {
      height: 230px;
      background: linear-gradient(145deg, #292929, #111);
      border-radius: 8px;
      display: flex;
      align-items: end;
      padding: 12px;
      cursor: pointer;
      transition: transform .2s;
    }

    .movie:hover {
      transform: scale(1.04);
    }

    .movie span {
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">WATCHLY</div>
  <input class="search" type="text" placeholder="Search...">
</header>

<div class="hero">
  <div>
    <h1>Watch Something Great.</h1>
    <p>
      Discover movies and watch legally available free films from one simple place.
    </p>
    <button class="watch-btn">▶ Start Watching</button>
  </div>
</div>

<section>
  <h2>🔥 Popular Movies</h2>

  <div class="movies">
    <div class="movie"><span>Movie One</span></div>
    <div class="movie"><span>Movie Two</span></div>
    <div class="movie"><span>Movie Three</span></div>
    <div class="movie"><span>Movie Four</span></div>
    <div class="movie"><span>Movie Five</span></div>
    <div class="movie"><span>Movie Six</span></div>
  </div>
</section>

<footer>
  © 2026 Watchly tarkue made it❤️
</footer>

</body><script> 
document.querySelectorAll('a').forEach(function(link) {
  const text = link.textContent.toLowerCase();

  if (
    text.includes('watch') ||
    text.includes('play')
  ) {
    link.href = 'player.html';
  }
});
</script>
  </html>
